<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- ═══════════════════════════════════════════
       PWA META TAGS
  ════════════════════════════════════════════ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pass">
  <meta name="theme-color" content="#150A34">

  <title>Ticket</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #1A1035;
      font-family: -apple-system, 'Roboto', system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Conteneur racine plein écran */
    .app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: #F2F2F7;
    }

    /* ─────────────────────────────────────────────
       HEADER
    ───────────────────────────────────────────── */
    .header {
      flex-shrink: 0;
      position: relative;
      z-index: 10;
      background: #150A34;
      padding-top: env(safe-area-inset-top, 0px);
    }

    .header__inner {
      height: 62px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      position: relative;
    }

    .header__back {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #19132D;
      border: 1.5px solid #362A5C;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      -webkit-appearance: none;
      appearance: none;
      outline: none;
    }

    .header__title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* ─────────────────────────────────────────────
       ZONE SCREENSHOT SCROLLABLE
       flex: 1 → prend tout l'espace entre header et tabbar
    ───────────────────────────────────────────── */
    .content-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
      /* Le fond gris disparaît derrière l'image */
      background: #F2F2F7;
    }

    .content-drag {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      will-change: transform;
      touch-action: pan-y;
    }

    /* ⬇️ MODIFIER ICI : remplacez "ticket.png" par votre fichier */
    .ticket-screenshot {
      width: 100%;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* ─────────────────────────────────────────────
       HORLOGE LIVE
       Position réglée via CLOCK_TOP / CLOCK_RIGHT dans le <script>
    ───────────────────────────────────────────── */
    .clock-overlay {
      position: absolute;
      color: #162044;
      font-size: 16px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.3px;
      pointer-events: none;
      z-index: 5;
    }

    /* ─────────────────────────────────────────────
       TAB BAR — collée en bas, pleine largeur, blanche
       flex-shrink: 0 → jamais écrasée par le contenu
    ───────────────────────────────────────────── */
    .tabbar {
      flex-shrink: 0;
      z-index: 20;
      background: #FFFFFF;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      /* hauteur fixe + safe area home indicator iPhone */
      padding-bottom: env(safe-area-inset-bottom, 0px);
      height: calc(64px + env(safe-area-inset-bottom, 0px));
      padding-left: 8px;
      padding-right: 8px;
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 52px;
      border-radius: 33px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .tab-item.active {
      background: #E4E4E4;
      flex: 1.35;
    }

    .tab-item__label {
      font-size: 12px;
      font-weight: 500;
      color: #8E8E93;
      line-height: 1;
    }

    .tab-item.active .tab-item__label {
      color: #1C1C1E;
    }

    .tab-icon {
      width: 22px;
      height: 22px;
      fill: #AEAEB2;
    }

    .tab-item.active .tab-icon {
      fill: #1C1C1E;
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ═══════════════════════════════════════════
       HEADER
  ════════════════════════════════════════════ -->
  <header class="header">
    <div class="header__inner">
      <button class="header__back" aria-label="Retour">
        <svg width="9" height="16" viewBox="0 0 9 16" fill="none">
          <path d="M8 1L1 8L8 15"
                stroke="white" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <span class="header__title">Ticket</span>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════
       ZONE SCREENSHOT SCROLLABLE (doigt vers le haut = voir la suite)
  ════════════════════════════════════════════ -->
  <main class="content-wrapper" id="contentWrapper">
    <div class="content-drag" id="contentDrag">

      <!-- ⬇️ MODIFIER ICI : mettez le nom de votre image ici -->
      <img
        class="ticket-screenshot"
        id="ticketImg"
        src="ticket.jpeg"
        alt="Interrail Pass Ticket"
        draggable="false"
      />

      <!-- Horloge live — positionnée par CLOCK_TOP / CLOCK_RIGHT ci-dessous -->
      <div class="clock-overlay" id="clockOverlay"></div>

    </div>
  </main>

  <!-- ═══════════════════════════════════════════
       TAB BAR — collée en bas, blanche, pleine largeur
  ════════════════════════════════════════════ -->
  <nav class="tabbar" aria-label="Navigation principale">

    <!-- Planner -->
    <div class="tab-item" role="button" aria-label="Planner">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
                 10-4.48 10-10S17.52 2 12 2zm.5 5v5.25l4.5 2.67
                 -.75 1.23L11 13V7h1.5z"/>
      </svg>
      <span class="tab-item__label">Planner</span>
    </div>

    <!-- My Trip -->
    <div class="tab-item" role="button" aria-label="My Trip">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M20 6h-3V4c0-1.1-.9-2-2-2H9C7.9 2 7 2.9 7 4v2H4
                 c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9
                 2-2V8c0-1.1-.9-2-2-2zM9 4h6v2H9V4zm11 15H4V8h16v11z"/>
        <path d="M11 10h2v7h-2z M8 10h2v7H8z M14 10h2v7h-2z"/>
      </svg>
      <span class="tab-item__label">My Trip</span>
    </div>

    <!-- My Pass — onglet actif -->
    <div class="tab-item active" role="button" aria-label="My Pass" aria-current="page">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M20 4H4C2.89 4 2 4.89 2 6v12c0 1.11.89 2 2 2h16
                 c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0
                 -10H4V6h16v2zM6 14h7v2H6zm9 0h3v2h-3z"/>
      </svg>
      <span class="tab-item__label">My Pass</span>
    </div>

    <!-- More -->
    <div class="tab-item" role="button" aria-label="More">
      <svg class="tab-icon" viewBox="0 0 24 24">
        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
      </svg>
      <span class="tab-item__label">More</span>
    </div>

  </nav>

</div>

<script>
  // ============================================================
  // ⬇️ MODIFIER ICI — Position de l'horloge sur le screenshot
  //   CLOCK_TOP   = pixels depuis le haut de l'image    ↕
  //   CLOCK_RIGHT = pixels depuis le bord droit         ↔
  // ============================================================
  const CLOCK_TOP   = 18;
  const CLOCK_RIGHT = 20;   // augmenté : recule légèrement du bord droit

  // ── Horloge live ───────────────────────────────────────────
  const clockEl = document.getElementById('clockOverlay');
  clockEl.style.top   = CLOCK_TOP + 'px';
  clockEl.style.right = CLOCK_RIGHT + 'px';

  function tick() {
    const d  = new Date();
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    clockEl.textContent = `${hh}:${mm}:${ss}`;
  }
  tick();
  setInterval(tick, 1000);

  // ── Scroll vertical libre (doigt vers le haut = voir la suite) ──
  //
  //   • Le contenu ne peut PAS descendre sous sa position initiale
  //     (pas de gap au-dessus du ticket)
  //   • Le contenu remonte jusqu'à ce que toute l'image soit visible
  //   • Rubber-banding élastique aux deux extrémités
  // ────────────────────────────────────────────────────────────────
  const dragEl    = document.getElementById('contentDrag');
  const wrapper   = document.getElementById('contentWrapper');
  const img       = document.getElementById('ticketImg');

  let overflow = 0;  // calculé dynamiquement après chargement image
  let baseY    = 0;  // position courante (0 = en haut, -overflow = en bas)
  let liveY    = 0;
  let startY   = 0;
  let dragging = false;

  function calcOverflow() {
    overflow = Math.max(0, dragEl.scrollHeight - wrapper.clientHeight);
  }

  // Calcul dès que l'image est chargée (ou si déjà en cache)
  img.addEventListener('load', calcOverflow);
  if (img.complete) calcOverflow();
  window.addEventListener('resize', calcOverflow);
  // Sécurité : recalcul après un court délai
  setTimeout(calcOverflow, 300);

  function applyY(y, animated) {
    dragEl.style.transition = animated
      ? 'transform .32s cubic-bezier(.25,.46,.45,.94)'
      : 'none';
    dragEl.style.transform = `translateY(${y}px)`;
  }

  dragEl.addEventListener('touchstart', e => {
    dragging = true;
    startY   = e.touches[0].clientY;
    dragEl.style.transition = 'none';
  }, { passive: true });

  dragEl.addEventListener('touchmove', e => {
    if (!dragging) return;
    const delta = e.touches[0].clientY - startY;  // positif = doigt descend
    let next    = baseY + delta;

    // Rubber-banding : résistance si on sort des bornes
    if (next > 0)          next = next * 0.25;           // résiste au gap en haut
    if (next < -overflow)  next = -overflow + (next + overflow) * 0.25; // résiste en bas

    liveY = next;
    applyY(liveY, false);
  }, { passive: true });

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    // Snap aux bornes si hors limites, sinon reste en place
    if (liveY > 0)          baseY = 0;
    else if (liveY < -overflow) baseY = -overflow;
    else                    baseY = liveY;
    applyY(baseY, true);
    liveY = baseY;
  }

  dragEl.addEventListener('touchend',    onEnd);
  dragEl.addEventListener('touchcancel', onEnd);
</script>

</body>
</html>
